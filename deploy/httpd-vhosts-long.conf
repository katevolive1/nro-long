# Dán đoạn này vào cuối C:\xampp\apache\conf\extra\httpd-vhosts.conf rồi Stop/Start Apache.
# Sửa ổ đĩa trong 2 đường dẫn web nếu repo nằm chỗ khác (vd F:/AILinhTinh/nro-long/web).
# Mọi thứ web lấy từ repo, không dùng htdocs. File tải client: web\download\NRO-long.rar (git bỏ qua, do client-patch\cap-nhat-client.bat tạo).
# Nếu C:\xampp\apache\conf\httpd.conf chưa có dòng "Listen 8080" thì bỏ dấu # ở dòng Listen dưới (có rồi mà thêm nữa thì Apache không chạy).
#Listen 8080
<VirtualHost *:8080>
    DocumentRoot "D:/AILinhTinh/nro-long/web"
    php_value session.name NROLONGSESSID
    <Directory "D:/AILinhTinh/nro-long/web">
        Options Indexes FollowSymLinks Includes ExecCGI
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
