# Dán đoạn này vào cuối C:\xampp\apache\conf\extra\httpd-vhosts.conf rồi Stop/Start Apache.
# Sửa đường dẫn nếu repo nằm chỗ khác. /download dùng chung thư mục tải của web gốc.
Listen 8081
<VirtualHost *:8081>
    DocumentRoot "D:/AILinhTinh/nro-long/web"
    Alias /download "C:/xampp/htdocs/download"
    php_value session.name NROLONGSESSID
    <Directory "D:/AILinhTinh/nro-long/web">
        Options Indexes FollowSymLinks Includes ExecCGI
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
